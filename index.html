<style>
/* Layout: full-screen low-poly island; header card top-left, zone chips bottom, detail sheet slides in (right on desktop, bottom on phone).
   Single daylight look by choice: sea + sand + balance-scale gold. */
:root{
  --sea:#2f8fa3; --sea-deep:#1d5f73; --sand:#f3e3c3; --ink:#203a44; --ink-soft:#4d6670;
  --paper:#fffdf8; --gold:#d99a2b; --coral:#e2685a; --leaf:#5a9e6f; --line:rgba(32,58,68,.14);
  --display:"LXGW WenKai TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:#eee3d3;color:var(--ink);font-family:var(--body);overflow:hidden}
#scene{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none}
.hud{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));z-index:5;
  width:min(292px,calc(100% - 32px));background:rgba(255,253,248,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:1px solid var(--line);border-radius:12px;padding:10px 12px 10px 14px;box-shadow:0 6px 18px rgba(29,95,115,.14);overflow:hidden}
.hud::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--gold),var(--coral))}
.hud-logo{display:flex;align-items:center;gap:8px;margin:0 0 8px}
.hud-logo img{height:28px;width:auto;display:block;flex:none;max-width:52%}
.hud-logo h1{margin:0;font-size:19px;white-space:nowrap;padding-left:8px;border-left:1px solid var(--line);line-height:1.1}
.hud-logo .hud-yr{margin-left:auto;display:flex;align-items:center;gap:4px}
.hud-logo .hud-live{margin-right:0;background:#bff0d4}
@media (max-width:759px){.hud-logo img{height:20px}.hud-logo h1{font-size:15px;padding-left:6px}}
.hud-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.eyebrow{font-size:10.5px;letter-spacing:.12em;color:var(--ink-soft);margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-yr{flex:none;font:700 10.5px var(--body);letter-spacing:.06em;color:#fff;background:var(--sea);border-radius:4px;padding:1px 6px}
h1{font-family:var(--display);font-weight:700;font-size:21px;margin:2px 0 8px;line-height:1.15;letter-spacing:.02em}
h1 span{color:var(--gold)}
.sub{display:none}
.stats{display:grid;grid-template-columns:repeat(4,1fr);margin:0;padding-top:8px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.stat{text-align:center;padding:0 2px;position:relative}
.stat+.stat::before{content:"";position:absolute;left:0;top:3px;bottom:3px;width:1px;background:var(--line)}
.stat b{display:block;font-family:var(--body);font-weight:700;font-size:17px;line-height:1.1;color:var(--sea-deep)}
.stat b i{font-style:normal;font-size:11px;font-weight:600;margin-left:1px;color:var(--ink-soft)}
.stat small{display:block;margin-bottom:1px;font-size:10px;letter-spacing:.04em;color:var(--ink-soft);white-space:nowrap}
.hud-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;padding-top:7px;border-top:1px solid var(--line);font-size:11px;color:var(--ink-soft);letter-spacing:.03em}
.tour-btn{border:0;border-radius:999px;background:var(--sea);color:#fff;font:700 11.5px var(--body);padding:4px 11px;cursor:pointer;flex:none}
.tour-btn:focus-visible,.tour button:focus-visible{outline:3px solid #f2c95a;outline-offset:2px}
.tour{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:7;display:flex;align-items:center;gap:6px;
  background:rgba(32,58,68,.9);color:#fff;border-radius:999px;padding:6px 8px;box-shadow:0 6px 20px rgba(20,50,60,.3);font:600 13px var(--body)}
.tour[hidden]{display:none}
.tour button{width:34px;height:34px;border:0;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;font-size:15px;cursor:pointer}

.tour button:hover{background:rgba(255,255,255,.26)}

.donut-row{display:flex;align-items:center;gap:14px;margin:10px 0 4px}

.donut b small{font:500 10px var(--body);color:var(--ink-soft)}
.legend{display:grid;gap:5px;font-size:12.5px}.legend span{display:flex;align-items:center;gap:6px}.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.mv{height:8px;margin:5px auto 0;width:86%;display:flex;align-items:flex-end;justify-content:center}
.mv.dots{flex-wrap:wrap;gap:1.5px;height:auto;width:62px}.mv.dots i{width:5px;height:5px;border-radius:50%;background:var(--sea);opacity:.85}
.mv.dots i:nth-child(3n){opacity:.55}
.mv.ticks{gap:1px}.mv.ticks i{flex:1;max-width:2px;background:var(--gold);border-radius:1px;height:100%}
.mv.ticks i:nth-child(odd){height:65%}.mv.ticks i:nth-child(5n){height:100%;background:var(--coral)}
.mv.split{height:7px;border-radius:4px;overflow:hidden;gap:1px;background:var(--line)}
.mv.split span{display:block;height:100%}.mv.split span:nth-child(1){background:var(--coral)}.mv.split span:nth-child(2){background:var(--gold)}.mv.split span:nth-child(3){background:var(--leaf)}
.hud-live{display:inline-block;width:6px;height:6px;border-radius:50%;background:#3cbf7a;margin-right:5px;vertical-align:1px;box-shadow:0 0 0 0 rgba(60,191,122,.6);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 5px rgba(60,191,122,0)}100%{box-shadow:0 0 0 0 rgba(60,191,122,0)}}
@media (prefers-reduced-motion:reduce){.hud-live{animation:none}}
@media (max-width:759px){.mv.dots{width:50px}.mv.dots i{width:4px;height:4px}.hud{width:min(250px,calc(100% - 120px));padding:8px 10px 8px 12px}h1{font-size:17px;margin-bottom:6px}.stat b{font-size:15px}.stat small{font-size:9.5px}.eyebrow{font-size:9.5px}}
.labels{position:fixed;inset:0;pointer-events:none;z-index:3}
.pin{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;border:0;
  background:var(--paper);color:var(--ink);font-family:var(--display);font-size:15px;font-weight:700;
  padding:.3em .75em .3em .55em;border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.16);white-space:nowrap;line-height:1.2;
  display:flex;align-items:center;gap:.4em;transition:transform .15s;opacity:.94}
.pin i{width:.65em;height:.65em;border-radius:50%;background:var(--c);flex:none}
.pin .t{display:inline}
.pin.compact{padding:5px;gap:0}
.pin.compact .t{display:none}
.pin.compact:hover .t,.pin.compact:focus-visible .t{display:inline;margin-left:5px}
.pin.on .t{display:inline}
.pin:hover,.pin:focus-visible{transform:translate(-50%,-100%) scale(1.08);outline:2px solid var(--c)}
.pin.on{background:var(--c);color:#fff}
.pin.on i{background:#fff}
/* the island title is the umbrella concept: a ribbon badge, larger and warmer than the landmark labels */
.pin.main{background:linear-gradient(135deg,#f7d58a,#f2a98a);color:#fff;border:2px solid #fff;padding:.3em .85em .3em .7em;
  letter-spacing:.06em;box-shadow:0 4px 16px rgba(170,110,50,.35);text-shadow:0 1px 2px rgba(150,80,30,.35);opacity:1}
.pin.main i{display:none}
.pin.main::before{content:"";width:.55em;height:.55em;background:#fff;transform:rotate(45deg);border-radius:2px;flex:none}
.pin.main::after{content:"";position:absolute;left:50%;bottom:-.55em;transform:translateX(-50%);border:.5em solid transparent;border-top-color:#f3b385;border-bottom:0}
.pin.main.on{background:linear-gradient(135deg,#f2c36a,#ec937a)}
.chips{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;gap:8px;overflow-x:auto;
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:rgba(255,253,248,.92);color:var(--ink);font-family:var(--body);
  font-size:13px;padding:7px 12px;border-radius:999px;cursor:pointer}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.main{background:linear-gradient(135deg,#f7d58a,#f2a98a);color:#fff;border-color:transparent;font-weight:700;letter-spacing:.06em}
.chip.main.on{background:linear-gradient(135deg,#e9b75e,#e48c74)}
.chip:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.sheet{position:fixed;z-index:6;background:var(--paper);box-shadow:0 10px 40px rgba(20,50,60,.28);
  display:flex;flex-direction:column;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
@media (min-width:760px){
  .sheet{top:calc(12px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(64px + env(safe-area-inset-bottom,0px));
    width:400px;border-radius:16px;transform:translateX(calc(100% + 40px))}
  .sheet.open{transform:none}
}
@media (max-width:759px){
  .sheet{left:0;right:0;bottom:0;max-height:68%;border-radius:18px 18px 0 0;transform:translateY(105%);
    padding-bottom:env(safe-area-inset-bottom,0px)}
  .sheet.open{transform:none}
  .hud .sub{display:none}
}
.sheet .body>*{transition:opacity .45s ease,transform .45s ease}
.sheet:not(.reveal) .body>*{opacity:0;transform:translateY(10px)}
.sheet.reveal .body>*:nth-child(1){transition-delay:.12s}.sheet.reveal .body>*:nth-child(2){transition-delay:.2s}.sheet.reveal .body>*:nth-child(3){transition-delay:.28s}
.sheet.reveal .body>*:nth-child(4){transition-delay:.36s}.sheet.reveal .body>*:nth-child(5){transition-delay:.44s}.sheet.reveal .body>*:nth-child(n+6){transition-delay:.52s}
@media (prefers-reduced-motion:reduce){.sheet .body>*{transition:none}.sheet:not(.reveal) .body>*{opacity:1;transform:none}}
.sheet header{padding:16px 18px 10px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.sheet header .tag{font-size:12px;letter-spacing:.06em;color:var(--c);font-weight:700;margin:0}
.sheet h2{font-family:var(--display);font-size:24px;margin:2px 0 0;line-height:1.2;text-wrap:balance}
.close{margin-left:auto;border:0;background:#f1ece0;color:var(--ink);width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer;flex:none}
.close:focus-visible{outline:2px solid var(--gold)}
.body{overflow-y:auto;padding:12px 18px 20px;min-width:0;line-height:1.65;font-size:14.5px}
.body p{margin:0 0 10px}
.body h3{font-family:var(--display);font-size:17px;margin:16px 0 6px;color:var(--c)}
.lesson{display:grid;grid-template-columns:62px 1fr;gap:4px 10px;padding:8px 0;border-top:1px dashed var(--line)}
.lesson .d{font-variant-numeric:tabular-nums;color:var(--ink-soft);font-size:13px}
.lesson .t{font-weight:500}
.lesson .cls{grid-column:2;font-size:12px;color:var(--ink-soft)}
.bars{display:grid;gap:8px;margin:8px 0}
.bar{display:grid;grid-template-columns:1fr auto;gap:2px 8px;font-size:13px;font-variant-numeric:tabular-nums}
.bar .track{grid-column:1/-1;height:10px;border-radius:5px;background:#efe7d4;overflow:hidden}
.bar .fill{height:100%;background:var(--c)}
.note{font-size:12.5px;color:var(--ink-soft);background:#f6f1e6;border-radius:8px;padding:8px 10px;margin-top:10px}
.list{margin:0;padding-left:1.2em}
.list li{margin-bottom:4px}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.pills span{font-size:12.5px;padding:3px 9px;border-radius:999px;background:color-mix(in srgb,var(--c) 14%,#fff);color:var(--ink)}
.hint{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:calc(14px + env(safe-area-inset-top,0px));z-index:4;
  font-size:12px;color:var(--ink);background:rgba(255,253,248,.8);padding:5px 10px;border-radius:999px}
@media (max-width:759px){.hint{display:none}}
.music{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:calc(48px + env(safe-area-inset-top,0px));z-index:4;border:0;cursor:pointer;
  font:600 13px var(--body);color:var(--ink);background:rgba(255,253,248,.88);padding:6px 12px;border-radius:999px;box-shadow:0 2px 10px rgba(20,50,60,.15)}
.music[aria-pressed="true"]{background:var(--sea);color:#fff}
.pinsbtn{top:calc(84px + env(safe-area-inset-top,0px))}
body.pins-off .pin:not(.main):not(.on){opacity:0!important;pointer-events:none;transform:translate(-50%,-90%) scale(.9)}
.pin{transition:opacity .3s,transform .3s}

.splash{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:rgba(232,244,246,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);cursor:pointer;transition:opacity .45s}
.splash.out{opacity:0;pointer-events:none}
.splash-card{background:var(--paper);border-radius:22px;padding:26px 34px 24px;text-align:center;box-shadow:0 14px 44px rgba(20,50,60,.25);max-width:calc(100% - 32px)}
.splash-k{font:600 12px var(--body);letter-spacing:.3em;color:var(--gold)}
.splash-logo{display:block;height:44px;width:auto;max-width:100%;margin:0 auto 10px}
.sheet-logo{display:block;height:40px;width:auto;max-width:100%;margin:2px 0 12px}
.splash h2{font:700 30px var(--display);color:var(--ink);margin:.15em 0 .1em}
.splash p{font:400 14px var(--body);color:#4d6670;margin:0 0 6px}
.splash p.splash-by{font:500 13px var(--body);color:var(--ink);margin:0 0 18px;padding-top:8px;border-top:1px solid var(--line);letter-spacing:.04em}
.splash button{border:0;border-radius:999px;background:var(--sea);color:#fff;font:700 16px var(--body);padding:10px 24px;cursor:pointer;box-shadow:0 4px 14px rgba(47,143,163,.35)}
@media (max-width:759px){.music{top:calc(12px + env(safe-area-inset-top,0px));padding:6px 10px}.music span{display:none}.pinsbtn{top:calc(52px + env(safe-area-inset-top,0px))}}

.ph{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:6px}
.ph button{padding:0;border:0;border-radius:10px;overflow:hidden;cursor:zoom-in;background:#efe9de;display:flex;flex-direction:column;text-align:left}
.ph img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;transition:transform .2s}
.ph button:hover img{transform:scale(1.04)}
.ph span{font-size:12px;color:var(--ink-soft);padding:5px 7px 7px;line-height:1.35}
.ph button:focus-visible{outline:2px solid var(--c)}
.ph-note{font-size:12px;color:var(--ink-soft);margin:6px 0 0}
.lb[hidden]{display:none!important}
.lb{position:fixed;inset:0;z-index:20;background:rgba(28,34,44,.86);display:flex;align-items:center;justify-content:center;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lb figure{margin:0;max-width:min(92vw,980px);display:flex;flex-direction:column;align-items:center;gap:10px}

.lb-x{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.9);font-size:22px;cursor:pointer;color:#203a44}
.lb-n{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:64px;border:0;border-radius:12px;background:rgba(255,255,255,.85);font-size:30px;cursor:pointer;color:#203a44}

const TEXSRC={};
function texSource(kind){if(TEXSRC[kind])return TEXSRC[kind];
  const S=512,c=document.createElement('canvas'),b=document.createElement('canvas');c.width=b.width=S;c.height=b.height=S;
  const g=c.getContext('2d'),q=b.getContext('2d');const rnd=(a,z)=>a+Math.random()*(z-a);

    for(let r=0;r<rows;r++)for(let k=-1;k<5;k++){const x=k*bw+(r%2)*bw/2,y=r*bh;const v=rnd(175,255);
      g.fillStyle=tone(v);g.fillRect(x+4,y+4,bw-8,bh-8);q.fillStyle=tone(rnd(200,255));q.fillRect(x+4,y+4,bw-8,bh-8);
      for(let i=0;i<30;i++){g.fillStyle=`rgba(0,0,0,${rnd(.03,.1)})`;g.fillRect(x+rnd(6,bw-10),y+rnd(6,bh-10),2,2)}}}
  else if(kind==='stone'){let y=0;while(y<S){const rh=rnd(48,80);let x=-rnd(0,60);while(x<S){const rw=rnd(70,140),v=rnd(170,250);
      g.fillStyle=tone(v);g.beginPath();g.roundRect?g.roundRect(x+4,y+4,rw-8,rh-8,10):g.rect(x+4,y+4,rw-8,rh-8);g.fill();
      q.fillStyle=tone(rnd(190,255));q.beginPath();q.roundRect?q.roundRect(x+5,y+5,rw-10,rh-10,12):q.rect(x+5,y+5,rw-10,rh-10);q.fill();x+=rw}y+=rh}
    g.fillStyle=tone(150);g.globalCompositeOperation='destination-over';g.fillRect(0,0,S,S);g.globalCompositeOperation='source-over'}
  else if(kind==='plank'){const n=8,ph=S/n;for(let r=0;r<n;r++){let x=-rnd(0,200);while(x<S){const L=rnd(180,320),v=rnd(185,245);
      g.fillStyle=tone(v);g.fillRect(x+2,r*ph+3,L-4,ph-6);q.fillStyle=tone(230);q.fillRect(x+2,r*ph+3,L-4,ph-6);
      for(let i=0;i<5;i++){g.strokeStyle=`rgba(0,0,0,${rnd(.04,.1)})`;g.lineWidth=1.5;g.beginPath();const yy=r*ph+rnd(8,ph-8);g.moveTo(x+4,yy);g.bezierCurveTo(x+L*.3,yy+rnd(-4,4),x+L*.7,yy+rnd(-4,4),x+L-4,yy);g.stroke()}x+=L}}
    g.fillStyle=tone(120);g.globalCompositeOperation='destination-over';g.fillRect(0,0,S,S);g.globalCompositeOperation='source-over'}
  else if(kind==='roof'){const rows=10,rh=S/rows,tw=S/8;for(let r=0;r<rows;r++)for(let k=-1;k<9;k++){const x=k*tw+(r%2)*tw/2,y=r*rh;
      const gr=g.createLinearGradient(0,y,0,y+rh);gr.addColorStop(0,tone(rnd(215,250)));gr.addColorStop(1,tone(150));g.fillStyle=gr;
      g.beginPath();g.moveTo(x+3,y);g.lineTo(x+tw-3,y);g.lineTo(x+tw-3,y+rh*.8);g.quadraticCurveTo(x+tw/2,y+rh*1.05,x+3,y+rh*.8);g.closePath();g.fill();
      const qr=q.createLinearGradient(0,y,0,y+rh);qr.addColorStop(0,'#fff');qr.addColorStop(1,'#333');q.fillStyle=qr;q.fillRect(x+3,y,tw-6,rh)}}
  else if(kind==='wood'){g.fillStyle=tone(212);g.fillRect(0,0,S,S);
    for(let i=0;i<70;i++){const x0=rnd(0,S),amp=rnd(2,7),f=rnd(.01,.03),v=rnd(120,190);g.strokeStyle=`rgba(${v|0},${v|0},${v|0},${rnd(.25,.6)})`;g.lineWidth=rnd(1,3.5);
      g.beginPath();for(let y=0;y<=S;y+=8){const x=x0+Math.sin(y*f+i)*amp;y?g.lineTo(x,y):g.moveTo(x,y)}g.stroke()}
    for(let k=0;k<3;k++){const x=rnd(40,S-40),y=rnd(40,S-40);for(let r=4;r<22;r+=4){g.strokeStyle='rgba(110,110,110,.35)';g.lineWidth=1.5;g.beginPath();g.ellipse(x,y,r*.6,r*1.4,0,0,6.3);g.stroke()}}}
  else if(kind==='cobble'){g.fillStyle=tone(135);g.fillRect(0,0,S,S);for(let i=0;i<260;i++){const x=rnd(0,S),y=rnd(0,S),r=rnd(14,26),v=rnd(175,250);
      for(const ox of [-S,0,S])for(const oy of [-S,0,S]){g.fillStyle=tone(v);g.beginPath();g.ellipse(x+ox,y+oy,r,r*rnd(.7,.95),rnd(0,3),0,6.3);g.fill();
        const qg=q.createRadialGradient(x+ox,y+oy,0,x+ox,y+oy,r);qg.addColorStop(0,'#fff');qg.addColorStop(1,'#444');q.fillStyle=qg;q.beginPath();q.arc(x+ox,y+oy,r,0,6.3);q.fill()}}}
  else{g.fillStyle=tone(247);g.fillRect(0,0,S,S);for(let i=0;i<1600;i++){const v=rnd(236,255);g.fillStyle=tone(v);g.fillRect(rnd(0,S),rnd(0,S),rnd(2,5),rnd(2,5))}q.fillStyle='#bbb';q.fillRect(0,0,S,S)}  // plaster: clean and light
  g.fillStyle='rgba(255,255,255,.3)';g.fillRect(0,0,S,S);   // soften to a light, hand-drawn pattern

const TMAT={};
function matT(kind,color,rx,ry,flat=false){rx=Math.max(.5,Math.round(rx*2)/2);ry=Math.max(.5,Math.round(ry*2)/2);

const PERF={t:0,n:0,level:0,skip:4,target:MOBILE?28:45,simSteps:2};
function degrade(){PERF.level++;
  // sharpness goes last: drop effects first, resolution only as a final resort
  if(PERF.level===1){P.dof=false;bokeh.enabled=false}
  else if(PERF.level===2){P.bloom=0;bloom.enabled=false;PERF.simSteps=1}
  else if(PERF.level===3){sun.shadow.mapSize.set(2048,2048);sun.shadow.map&&sun.shadow.map.dispose();sun.shadow.map=null}
  else if(PERF.level===4){Q.dpr=Math.max(1,Math.min(Q.dpr,1.5));renderer.setPixelRatio(Q.dpr);composer.setPixelRatio(Q.dpr);resize()}}
function perfTick(dt){if(PERF.skip>0){PERF.skip-=dt;return}PERF.t+=dt;PERF.n++;
  if(PERF.t>2.5){const fps=PERF.n/PERF.t;if(fps<PERF.target-3&&PERF.level<4)degrade();PERF.t=0;PERF.n=0}}
